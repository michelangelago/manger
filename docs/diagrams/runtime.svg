<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Execution and storage topology</title><desc id="desc">An operator starts the local PHP process. Telegram is reached over HTTPS. SQLite and configuration are on the application host.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#426a53"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><rect x="30" y="50" width="240" height="120" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="46" y="78" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Operator terminal</text><text x="46" y="104" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">composer migrate</text><text x="46" y="126" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">composer bot</text><rect x="380" y="50" width="315" height="160" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="396" y="78" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Application host</text><text x="396" y="104" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PHP CLI process + Nutgram</text><text x="396" y="126" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Long polling (outbound)</text><text x="396" y="148" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">No public webhook required</text><rect x="805" y="50" width="265" height="160" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="821" y="78" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Telegram</text><text x="821" y="104" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Bot API / external service</text><text x="821" y="126" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Receives replies</text><text x="821" y="148" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Provides user updates</text><path d="M270 110 L380 110" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M695 110 L805 110" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="750" y="94" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">HTTPS</text><rect x="50" y="335" width="280" height="125" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="66" y="363" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Local configuration</text><text x="66" y="389" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">.env</text><text x="66" y="411" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Bot token + APP_TIMEZONE</text><rect x="430" y="335" width="300" height="125" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="446" y="363" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Local persistence</text><text x="446" y="389" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">storage/database.sqlite</text><text x="446" y="411" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PDO + foreign keys enabled</text><rect x="820" y="335" width="250" height="125" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="836" y="363" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Separate static content</text><text x="836" y="389" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">docs/ HTML + SVG</text><text x="836" y="411" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">public/ status page</text><path d="M380 160 L190 160 L190 335" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="235" y="190" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">loads</text><path d="M535 210 L535 335" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="600" y="275" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">reads / writes</text><text x="30" y="535" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">No container deployment, supervisor, backup scheduler, public API, or monitoring service is defined in this repository.</text></svg>