<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Manger entity relationships</title><desc id="desc">Six application tables and one migration ledger. Parent to child cardinalities and actual foreign-key names are shown.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#426a53"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><rect x="30" y="35" width="250" height="160" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="46" y="63" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">users</text><text x="46" y="89" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PK id</text><text x="46" y="111" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">UQ telegram_id</text><text x="46" y="133" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">name</text><text x="46" y="155" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">created_at</text><rect x="365" y="35" width="260" height="185" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="381" y="63" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">daily</text><text x="381" y="89" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PK id</text><text x="381" y="111" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">FK user_id → users.id</text><text x="381" y="133" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">name</text><text x="381" y="155" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">date (nullable legacy)</text><text x="381" y="177" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">UQ (user_id, date)</text><rect x="725" y="35" width="335" height="220" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="741" y="63" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">daily_foods</text><text x="741" y="89" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PK id</text><text x="741" y="111" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">FK diet_id → daily.id</text><text x="741" y="133" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">FK food_id → foods.id</text><text x="741" y="155" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">quantity (grams)</text><text x="741" y="177" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">consumed_at</text><text x="741" y="199" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">No energy snapshot</text><rect x="30" y="330" width="250" height="150" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="46" y="358" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">calorie_goals</text><text x="46" y="384" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PK id</text><text x="46" y="406" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">FK + UQ user_id → users.id</text><text x="46" y="428" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">calories: positive integer</text><rect x="30" y="580" width="250" height="115" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="46" y="608" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">food_groups</text><text x="46" y="634" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PK id</text><text x="46" y="656" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">name (not UNIQUE)</text><rect x="365" y="360" width="260" height="180" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="381" y="388" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">foods</text><text x="381" y="414" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PK id</text><text x="381" y="436" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">name (not UNIQUE)</text><text x="381" y="458" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">energy (kcal / 100 g)</text><text x="381" y="480" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">FK food_group_id</text><text x="381" y="502" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">→ food_groups.id</text><rect x="725" y="500" width="335" height="115" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="741" y="528" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">migrations</text><text x="741" y="554" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PK name (migration filename)</text><text x="741" y="576" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Technical ledger; no foreign keys</text><path d="M280 115 L365 115" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="322" y="100" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">1 → 0..N</text><path d="M155 195 L155 330" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="210" y="270" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">1 → 0..1</text><path d="M625 130 L725 130" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="675" y="115" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">1 → 0..N</text><path d="M280 635 L325 635 L325 450 L365 450" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="330" y="660" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">1 → 0..N</text><path d="M625 450 L675 450 L675 230 L725 230" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="675" y="340" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">1 → 0..N</text><text x="30" y="735" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Each child foreign key is required. Parent rows may have no children. No delete cascades are declared.</text></svg>