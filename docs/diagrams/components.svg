<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc"><title id="title">Application components</title><desc id="desc">One PHP polling process uses handlers, helpers and PDO repositories. Telegram is external and SQLite is local.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#426a53"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><rect x="30" y="35" width="200" height="100" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="46" y="63" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Telegram chat</text><text x="46" y="89" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Sender commands</text><rect x="325" y="35" width="260" height="100" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="341" y="63" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Telegram Bot API</text><text x="341" y="89" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Updates + outgoing replies</text><rect x="710" y="35" width="350" height="100" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="726" y="63" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">bot.php + Nutgram</text><text x="726" y="89" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Load bootstrap → sync menu → poll</text><path d="M230 85 L325 85" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M585 85 L710 85" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="648" y="68" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">long polling</text><rect x="30" y="240" width="240" height="125" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="46" y="268" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">bootstrap.php</text><text x="46" y="294" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">.env and Configuration</text><text x="46" y="316" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PDO + repositories</text><text x="46" y="338" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Timezone and clock</text><rect x="365" y="240" width="260" height="125" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="381" y="268" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">commands.php</text><text x="381" y="294" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Route root commands</text><text x="381" y="316" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Inject handler dependencies</text><rect x="730" y="240" width="330" height="125" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="746" y="268" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Command handlers</text><text x="746" y="294" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Parse + validate</text><text x="746" y="316" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Identify user when personal</text><text x="746" y="338" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Call persistence / format reply</text><path d="M855 135 L855 200 L150 200 L150 240" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M270 300 L365 300" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M625 300 L730 300" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="30" y="505" width="250" height="120" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="46" y="533" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">View / input helpers</text><text x="46" y="559" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">CommandInput</text><text x="46" y="581" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">DailyFoodView / summary views</text><text x="46" y="603" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">GroupFoodView</text><rect x="390" y="505" width="240" height="120" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="406" y="533" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Repositories</text><text x="406" y="559" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">PDO prepared statements</text><text x="406" y="581" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Transactions + scoped queries</text><rect x="780" y="505" width="280" height="120" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="796" y="533" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">SQLite</text><text x="796" y="559" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">storage/database.sqlite</text><text x="796" y="581" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Foreign keys + unique keys</text><path d="M830 365 L830 430 L155 430 L155 505" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="400" y="420" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">presentation / validation</text><path d="M895 365 L895 460 L510 460 L510 505" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="630" y="450" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">persistence</text><path d="M630 565 L780 565" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="700" y="550" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">PDO</text><text x="30" y="700" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">public/index.php is a separate status endpoint. docs/ is static HTML. Neither is a bot webhook or HTTP application API.</text></svg>