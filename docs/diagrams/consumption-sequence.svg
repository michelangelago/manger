<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc"><title id="title">Consumption sequence</title><desc id="desc">A success sequence through the user, command handler, repositories and SQLite. First and later portions share the dated log key.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#426a53"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><rect x="10" y="25" width="210" height="60" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="26" y="53" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Telegram sender</text><path d="M115 90 L115 745" stroke="#c5d0c5" stroke-dasharray="5 5"/><rect x="265" y="25" width="210" height="60" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="281" y="53" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">DailyFoodCommand</text><path d="M370 90 L370 745" stroke="#c5d0c5" stroke-dasharray="5 5"/><rect x="560" y="25" width="210" height="60" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="576" y="53" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">DailyFoodRepository</text><path d="M665 90 L665 745" stroke="#c5d0c5" stroke-dasharray="5 5"/><rect x="870" y="25" width="210" height="60" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="886" y="53" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">SQLite database</text><path d="M975 90 L975 745" stroke="#c5d0c5" stroke-dasharray="5 5"/><path d="M115 135 L370 135" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="242.5" y="125" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">/eat via shortcut, or /dfoods -C</text><text x="370" y="183" text-anchor="middle" fill="#23332c" font-size="12" font-weight="400" font-family="system-ui, sans-serif">Validate; resolve user + food</text><path d="M370 230 L665 230" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="517.5" y="220" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">registerConsumption(user, food, grams, now)</text><path d="M665 290 L975 290" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="820.0" y="280" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">BEGIN</text><path d="M665 350 L975 350" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="820.0" y="340" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">INSERT daily ... ON CONFLICT DO NOTHING</text><path d="M665 410 L975 410" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="820.0" y="400" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">SELECT daily WHERE user_id AND date</text><path d="M975 460 L665 460" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="820.0" y="450" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">Existing or newly inserted daily ID</text><path d="M665 520 L975 520" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="820.0" y="510" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">INSERT daily_foods (diet_id, food_id, ...)</text><path d="M665 580 L975 580" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="820.0" y="570" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">COMMIT</text><path d="M665 635 L370 635" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="517.5" y="625" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">New entry ID</text><path d="M370 695 L115 695" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="242.5" y="685" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">Saved entry details (after owned read)</text><text x="30" y="780" text-anchor="start" fill="#23332c" font-size="12" font-weight="400" font-family="system-ui, sans-serif">User/food lookups and final owned read are summarized at the handler boundary. Transaction errors roll back and propagate.</text></svg>