<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc"><title id="title">Logging a consumed food</title><desc id="desc">Create reuses a user date log and inserts the portion in one transaction. Validation failures do not write. Database failures roll back.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#426a53"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><rect x="45" y="30" width="610" height="95" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="61" y="58" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">/eat &quot;food name&quot; grams or /dfoods -C</text><text x="61" y="84" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">EatCommand delegates to DailyFoodCommand.</text><rect x="45" y="175" width="610" height="95" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="61" y="203" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Validate input and resolve registered sender</text><text x="61" y="229" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Positive whole grams; known users.telegram_id.</text><rect x="45" y="320" width="610" height="95" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="61" y="348" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Find food by name</text><text x="61" y="374" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Missing food returns a message without inserting a log.</text><rect x="45" y="465" width="610" height="95" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="61" y="493" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">BEGIN transaction → get/create daily</text><text x="61" y="519" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">INSERT date + user; ON CONFLICT DO NOTHING; SELECT log.</text><rect x="45" y="610" width="610" height="95" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="61" y="638" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Insert daily_foods entry</text><text x="61" y="664" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Store daily ID, food ID, grams, and current timestamp.</text><rect x="45" y="755" width="610" height="95" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="61" y="783" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">COMMIT → read owned entry → send reply</text><text x="61" y="809" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Reply failure after commit does not roll back saved consumption.</text><path d="M350 125 L350 175" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M350 270 L350 320" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M350 415 L350 465" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M350 560 L350 610" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M350 705 L350 755" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="760" y="180" width="295" height="110" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="776" y="208" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Reject before writing</text><text x="776" y="234" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Usage / send /start</text><text x="776" y="256" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">or food-not-found reply</text><path d="M655 220 L760 220" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="708" y="208" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">invalid</text><path d="M655 365 L705 365 L705 255 L760 255" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="760" y="535" width="295" height="120" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="776" y="563" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">On database exception</text><text x="776" y="589" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">ROLLBACK daily + entry</text><text x="776" y="611" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Re-throw exception</text><text x="776" y="633" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">No new empty log remains</text><path d="M655 515 L705 515 L705 570 L760 570" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M655 655 L705 655 L705 610 L760 610" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/></svg>