<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">Implemented use cases</title><desc id="desc">Catalog commands are available to Telegram participants. Personal features require a registered sender. Operator actions are CLI only.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#426a53"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><rect x="25" y="40" width="240" height="130" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="41" y="68" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Telegram participant</text><text x="41" y="94" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Telegram identity</text><text x="41" y="116" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">No application admin role</text><rect x="25" y="350" width="240" height="130" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="41" y="378" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Registered sender</text><text x="41" y="404" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Has a users row</text><text x="41" y="426" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Identified by telegram_id</text><rect x="340" y="35" width="720" height="140" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="356" y="63" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Public / catalog use cases</text><text x="356" y="89" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">/start · register or refresh profile</text><text x="356" y="111" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">/help · command syntax and autocomplete</text><text x="356" y="133" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">/fgroup · group CRUD     /food · catalog CRUD     /gview · group view</text><rect x="340" y="330" width="720" height="170" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="356" y="358" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Personal use cases</text><text x="356" y="384" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">/eat or /dfoods -C · log a portion</text><text x="356" y="406" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">/dfoods · list, read, update, delete owned entries</text><text x="356" y="428" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">/daily · index or read logs     /dview · period summaries</text><text x="356" y="450" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">/goal · create, read, update, delete daily goal</text><path d="M265 105 L340 105" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M265 415 L340 415" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M145 350 L145 170" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="208" y="260" text-anchor="middle" fill="#426a53" font-size="12" font-weight="400" font-family="system-ui, sans-serif">Register with /start</text><rect x="25" y="555" width="240" height="100" rx="10" fill="#eaf1e8" stroke="#b9c9b9"/><text x="41" y="583" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">Operator</text><text x="41" y="609" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Terminal access</text><rect x="340" y="550" width="720" height="110" rx="10" fill="#fff" stroke="#b9c9b9"/><text x="356" y="578" text-anchor="start" fill="#23332c" font-size="16" font-weight="650" font-family="system-ui, sans-serif">CLI operations</text><text x="356" y="604" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">composer migrate · schema + seed</text><text x="356" y="626" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">composer bot · menu + polling     composer test · automated suite</text><path d="M265 605 L340 605" fill="none" stroke="#426a53" stroke-width="1.6" marker-end="url(#arrow)"/><text x="25" y="670" text-anchor="start" fill="#23332c" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Registered senders also use catalog commands. There is no administrator authorization check on catalog writes.</text></svg>